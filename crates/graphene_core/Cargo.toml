[package]
name = "graphene_core"
version = "0.1.0"
edition = "2021"

[dependencies]
slotmap = { version = "1.0", features = ["serde"] }
bitvec = "1.0"
smallvec = "1.11"
bitflags = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
graphene_algo = { path = "../graphene_algo" }
