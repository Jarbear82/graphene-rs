[package]
name = "graphene_layout"
version = "0.1.0"
edition = "2021"

[features]
default = []
parallel = ["dep:rayon"]

[dependencies]
graphene_core = { path = "../graphene_core" }
graphene_algorithms = { path = "../graphene_algorithms" }
graphene_style = { path = "../graphene_style" }
graphene_analysis = { path = "../graphene_analysis" }
rayon = { version = "1.8", optional = true }

[dev-dependencies]
graphene_fixtures = { path = "../graphene_fixtures" }
graphene_algorithms = { path = "../graphene_algorithms" }
graphene_gpui = { path = "../graphene_gpui" }
gpui = "0.2.2"
